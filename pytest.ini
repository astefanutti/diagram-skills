[pytest]
# Tests for the skills' Python scripts live under tests/, one subdirectory per
# skill (tests/diagram-layout/, ...). Limit collection to tests/ so the
# eval/agent-eval-harness submodule (its own test suite) isn't pulled in.
testpaths = tests
# importlib mode lets same-named test files (e.g. test_render.py) coexist in
# different per-skill subdirectories without import-name collisions.
addopts = --import-mode=importlib
